openapi: 3.0.0
info:
  title: Comment API
  description: Cloudflare Workersを利用したコメント管理API
  version: 1.0.0
servers:
  - url: https://hello.swisteria.workers.dev
  - url: https://blog-comments.swisteria.workers.dev
paths:
  /:
    get:
      summary: 特定のエントリIDのコメントを取得
      parameters:
        - name: entry
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: コメント取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  code:
                    type: string
                  msg:
                    type: string
                  res:
                    type: object
                    properties:
                      entryId: 
                        type : string
                      comments:
                        type : array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            comment:
                              type: string
                            tstmp:
                              type: string
                              format: date-time
        "400":
          description: entryパラメータが指定されていない、または空の場合
        "404":
          description: ルートパス以外へのリクエスト
        "405":
          description: サポートされていないHTTPメソッド
        "500":
          description: サーバーエラー

    post:
      summary: 新しいコメントを登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                comment:
                  type: string
                entryId:
                  type: string
      responses:
        "200":
          description: コメント登録成功
        "400":
          description: name、comment、entryIdのいずれかが指定されていない、または空の場合
        "404":
          description: ルートパス以外へのリクエスト
        "405":
          description: サポートされていないHTTPメソッド
        "500":
          description: Discord Webhookへの送信に失敗した場合

    options:
      summary: CORSプリフライトリクエスト
      responses:
        "200":
          description: プリフライトリクエスト成功
        "404":
          description: ルートパス以外へのリクエスト